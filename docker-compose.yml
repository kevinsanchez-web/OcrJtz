services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"   # solo accesible desde la propia Jetson (apps locales); internet entra por Caddy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 6g
    volumes:
      - api_data:/app/data      # historial de uso (SQLite, sin contenido de archivos); el resto del contenedor es de solo lectura
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para llegar a Ollama (VLM) instalado en la Jetson: LLM_URL=http://host.docker.internal:11434

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificados Let's Encrypt
      - caddy_config:/config

volumes:
  api_data:
  caddy_data:
  caddy_config:
